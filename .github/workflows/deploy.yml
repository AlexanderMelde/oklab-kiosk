name: Deploy Kiosk to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular PWA Application
        run: npm run build

      - name: Configure Custom Domain & SPA Fallback for GitHub Pages
        run: |
          echo "oklabkiosk.melde.net" > dist/oklab-kiosk/browser/CNAME
          cp dist/oklab-kiosk/browser/index.html dist/oklab-kiosk/browser/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/oklab-kiosk/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
